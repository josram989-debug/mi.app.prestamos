<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Préstamos V7</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 15px; 
            background-color: #f4f4f9;
        }
        .contenedor { 
            max-width: 600px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, button { 
            padding: 10px; 
            margin: 5px 0 15px 0; 
            width: 100%; 
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-azul { background-color: #007BFF; color: white; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .btn-verde { background-color: #28a745; color: white; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .btn-rojo { background-color: #dc3545; color: white; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .btn-gris { background-color: #6c757d; color: white; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
        
        #panel-mensajes {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            display: none; 
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            font-size: 14px;
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: center; 
        }
        .pagado { 
            background-color: #d4edda; 
            color: #155724;
            text-decoration: line-through; 
        }
        .cliente-item {
            background: #e9ecef;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cliente-item:hover { background-color: #dde2e6; }
        .seccion { display: none; }
        .activa { display: block; }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Control de Préstamos</h2>
        <div id="panel-mensajes"></div>

        <!-- SECCIÓN 1: LISTA DE CLIENTES -->
        <div id="vista-lista" class="seccion activa">
            <button class="btn-azul" onclick="mostrarFormularioNuevo()">+ Registrar Nuevo Préstamo</button>
            <h3>Lista de Clientes</h3>
            <div id="contenedor-clientes">
                <!-- Aquí se cargarán los clientes guardados -->
            </div>
            <button class="btn-rojo" onclick="limpiarTodo()" style="margin-top: 20px;">Borrar Todos los Datos</button>
        </div>

        <!-- SECCIÓN 2: FORMULARIO NUEVO PRÉSTAMO -->
        <div id="vista-formulario" class="seccion">
            <h3>Nuevo Préstamo</h3>
            <label>Concepto / Cliente:</label>
            <input type="text" id="concepto" placeholder="Ej. Maria Ferreira">

            <label>Monto del Préstamo:</label>
            <input type="tel" id="monto" placeholder="Ej. 1000000">
            
            <label>Interés Total (%):</label>
            <input type="tel" id="interes" placeholder="Ej. 32">
            
            <label>Plazo (cantidad de cuotas):</label>
            <input type="tel" id="plazo" placeholder="Ej. 44">
            
            <button class="btn-verde" onclick="guardarNuevoPrestamo()">Guardar y Generar Cuotas</button>
            <button class="btn-gris" onclick="volverA-Lista()">Cancelar</button>
        </div>

        <!-- SECCIÓN 3: DETALLE DEL CLIENTE SELECCIONADO -->
        <div id="vista-detalle" class="seccion">
            <button class="btn-gris" onclick="volverA-Lista()">← Volver a la Lista</button>
            <h3 id="detalle-titulo">Detalle del Préstamo</h3>
            <div id="detalle-info" style="margin-bottom: 10px; font-weight: bold;"></div>
            
            <table>
                <thead>
                    <tr>
                        <th>Detalle</th>
                        <th>Monto</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuotas-detalle">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        var listaPrestamos = [];
        var indiceActual = null;

        // Cargar datos al iniciar
        document.addEventListener("DOMContentLoaded", function() {
            cargarDatos();
            renderizarListaClientes();
        });

        function mostrarMensaje(texto, esError) {
            var panel = document.getElementById('panel-mensajes');
            panel.style.display = 'block'; 
            panel.innerText = texto;
            panel.style.backgroundColor = esError ? '#f8d7da' : '#d4edda';
            panel.style.color = esError ? '#721c24' : '#155724';
        }

        function cambiarVista(vistaId) {
            document.getElementById('vista-lista').classList.remove('activa');
            document.getElementById('vista-formulario').classList.remove('activa');
            document.getElementById('vista-detalle').classList.remove('activa');
            document.getElementById(vistaId).classList.add('activa');
        }

        function mostrarFormularioNuevo() {
            document.getElementById('concepto').value = '';
            document.getElementById('monto').value = '';
            document.getElementById('interes').value = '';
            document.getElementById('plazo').value = '';
            cambiarVista('vista-formulario');
        }

        function volverA-Lista() {
            renderizarListaClientes();
            cambiarVista('vista-lista');
        }

        function guardarNuevoPrestamo() {
            var concepto = document.getElementById('concepto').value.trim();
            var montoVal = parseFloat(document.getElementById('monto').value);
            var interesVal = parseFloat(document.getElementById('interes').value);
            var plazoVal = parseInt(document.getElementById('plazo').value);

            if (concepto === "" || isNaN(montoVal) || isNaN(interesVal) || isNaN(plazoVal)) {
                mostrarMensaje("Por favor, completa todos los campos correctamente.", true);
                return;
            }

            var montoInteres = montoVal * (interesVal / 100);
            var montoTotal = montoVal + montoInteres;
            var valorCuota = (montoTotal / plazoVal).toFixed(2);

            var cuotasArray = [];
            for (var i = 1; i <= plazoVal; i++) {
                cuotasArray.push({
                    numero: i,
                    monto: valorCuota,
                    pagado: false
                });
            }

            var nuevoPrestamo = {
                concepto: concepto,
                montoTotal: montoTotal.toFixed(2),
                cuotas: cuotasArray
            };

            listaPrestamos.push(nuevoPrestamo);
            guardarEnMemoria();
            mostrarMensaje("¡Préstamo creado con éxito!", false);
            volverA-Lista();
        }

        function renderizarListaClientes() {
            var contenedor = document.getElementById('contenedor-clientes');
            contenedor.innerHTML = "";

            if (listaPrestamos.length === 0) {
                contenedor.innerHTML = "<p style='text-align:center; color:#6c757d;'>No hay préstamos registrados.</p>";
                return;
            }

            for (var i = 0; i < listaPrestamos.length; i++) {
                var p = listaPrestamos[i];
                var div = document.createElement('div');
                div.className = 'cliente-item';
                div.innerHTML = '<span>' + p.concepto + '</span><span>Total: $' + p.montoTotal + ' →</span>';
                // Usamos una función autoejecutable para capturar el índice exacto
                div.onclick = (function(index) {
                    return function() { abrirDetalle(index); };
                })(i);
                contenedor.appendChild(div);
            }
        }

        function abrirDetalle(index) {
            indiceActual = index;
            var p = listaPrestamos[index];
            document.getElementById('detalle-titulo').innerText = "Cliente: " + p.concepto;
            document.getElementById('detalle-info').innerText = "Monto Total con Interés: $" + p.montoTotal;

            var tbody = document.getElementById('tabla-cuotas-detalle');
            tbody.innerHTML = "";

            for (var j = 0; j < p.cuotas.length; j++) {
                var c = p.cuotas[j];
                var tr = document.createElement('tr');
                if (c.pagado) {
                    tr.className = 'pagado';
                }

                var btnHtml = c.pagado 
                    ? '<button class="btn-gris" disabled>Cobrado</button>' 
                    : '<button class="btn-verde" onclick="marcarCuota(' + j + ')">Cobrar</button>';

                tr.innerHTML = '<td>Cuota ' + c.numero + '</td>' +
                               '<td>$' + c.monto + '</td>' +
                               '<td class="estado">' + (c.pagado ? "Pagado" : "Pendiente") + '</td>' +
                               '<td>' + btnHtml + '</td>';
                tbody.appendChild(tr);
            }

            cambiarVista('vista-detalle');
        }

        function marcarCuota(cuotaIndex) {
            listaPrestamos[indiceActual].cuotas[cuotaIndex].pagado = true;
            guardarEnMemoria();
            abrirDetalle(indiceActual); // Refresca la vista de detalles
            mostrarMensaje("Cuota marcada como cobrada.", false);
        }

        function guardarEnMemoria() {
            try {
                localStorage.setItem('listaPrestamosApp', JSON.stringify(listaPrestamos));
            } catch(e) {
                console.log("Error al guardar memoria");
            }
        }

        function cargarDatos() {
            try {
                var datos = localStorage.getItem('listaPrestamosApp');
                if (datos) {
                    listaPrestamos = JSON.parse(datos);
                }
            } catch(e) {
                listaPrestamos = [];
            }
        }

        function limpiarTodo() {
            if(confirm("¿Estás seguro de que deseas borrar todos los clientes y registros?")) {
                localStorage.removeItem('listaPrestamosApp');
                listaPrestamos = [];
                renderizarListaClientes();
                mostrarMensaje("Todos los datos fueron borrados.", false);
            }
        }
    </script>
</body>
</html>
