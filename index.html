<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Préstamos V4</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 15px; 
            background-color: #f4f4f9;
        }
        .contenedor { 
            max-width: 600px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, button { 
            padding: 10px; 
            margin: 5px 0 15px 0; 
            width: 100%; 
            box-sizing: border-box;
            font-size: 16px;
        }
        #btn-generar {
            background-color: #007BFF; /* Volvemos al azul profesional */
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }
        #btn-generar:hover { background-color: #0056b3; }
        
        #btn-borrar {
            background-color: #dc3545; 
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }
        
        /* Nuevo: Estilo para el panel de mensajes en pantalla */
        #panel-mensajes {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            display: none; /* Oculto por defecto */
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            font-size: 14px;
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: center; 
        }
        .pagado { 
            background-color: #d4edda; 
            color: #155724;
            text-decoration: line-through; 
        }
        .boton-cobrar {
            padding: 8px 5px; 
            font-size: 14px;
            margin: 0;
            background-color: #28a745; 
            color: white;
            border: none;
            border-radius: 3px;
        }
        .separador {
            background-color: #e9ecef;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Registrar Nuevo Préstamo</h2>
        
        <!-- Aquí aparecerán los mensajes de éxito o error -->
        <div id="panel-mensajes"></div>
        
        <label>Concepto / Cliente:</label>
        <input type="text" id="concepto" placeholder="Ej. Maria Ferreira">

        <label>Monto del Préstamo:</label>
        <input type="number" id="monto" placeholder="Ej. 1000000">
        
        <label>Interés Total (%):</label>
        <input type="number" id="interes" placeholder="Ej. 32">
        
        <label>Plazo (cantidad de cuotas):</label>
        <input type="number" id="plazo" placeholder="Ej. 44">
        
        <button id="btn-generar" onclick="generarPrestamo()">Generar Cuotas (V4)</button>
        <button id="btn-borrar" onclick="limpiarTodo()">Borrar Todos los Datos</button>

        <h3>Cronograma de Pagos</h3>
        <table>
            <thead>
                <tr>
                    <th>Detalle</th>
                    <th>Monto</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="listaCuotas">
            </tbody>
        </table>
    </div>

    <script>
        // Función auxiliar para mostrar mensajes en la pantalla en lugar de usar alert()
        function mostrarMensaje(texto, esError) {
            const panel = document.getElementById('panel-mensajes');
            panel.style.display = 'block'; // Lo hacemos visible
            panel.innerText = texto;
            
            if (esError) {
                panel.style.backgroundColor = '#f8d7da'; // Fondo rojo claro
                panel.style.color = '#721c24'; // Texto rojo oscuro
            } else {
                panel.style.backgroundColor = '#d4edda'; // Fondo verde claro
                panel.style.color = '#155724'; // Texto verde oscuro
            }
        }

        window.onload = function() {
            cargarDatosGuardados();
            mostrarMensaje("Sistema iniciado correctamente.", false);
        };

        function generarPrestamo() {
            try {
                // 1. Obtener valores y limpiar espacios
                const conceptoValor = document.getElementById('concepto').value.trim();
                const montoValor = document.getElementById('monto').value.trim();
                const interesValor = document.getElementById('interes').value.trim();
                const plazoValor = document.getElementById('plazo').value.trim();

                // 2. Validaciones que ahora usan el panel de mensajes
                if (conceptoValor === "") {
                    mostrarMensaje("Falta el nombre del cliente.", true);
                    return;
                }
                
                const monto = parseFloat(montoValor);
                if (isNaN(monto) || monto <= 0) {
                    mostrarMensaje("Revisa el monto ingresado.", true);
                    return;
                }
                
                const interes = parseFloat(interesValor);
                if (isNaN(interes) || interes < 0) {
                    mostrarMensaje("Revisa el porcentaje de interés.", true);
                    return;
                }
                
                const plazo = parseInt(plazoValor);
                if (isNaN(plazo) || plazo <= 0) {
                    mostrarMensaje("Revisa el plazo de cuotas.", true);
                    return;
                }

                // 3. Cálculos
                const montoInteres = monto * (interes / 100);
                const montoTotal = monto + montoInteres;
                const valorCuota = (montoTotal / plazo).toFixed(2); 

                const cuerpoTabla = document.getElementById('listaCuotas');

                const filaTitulo = document.createElement('tr');
                filaTitulo.innerHTML = <td colspan="4" class="separador">Préstamo: ${conceptoValor} - Total: $${montoTotal.toFixed(2)}</td>;
                cuerpoTabla.appendChild(filaTitulo);

                // 4. Generar las filas
                for (let i = 1; i <= plazo; i++) {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>Cuota ${i}</td>
                        <td>$${valorCuota}</td>
                        <td class="estado">Pendiente</td>
                        <td><button class="boton-cobrar" onclick="marcarPagado(this)">Cobrar</button></td>
                    `;
                    cuerpoTabla.appendChild(fila);
                }

                // 5. Guardar y limpiar
                guardarDatosEnMemoria();
                
                document.getElementById('concepto').value = '';
                document.getElementById('monto').value = '';
                document.getElementById('interes').value = '';
                document.getElementById('plazo').value = '';

                // Mostrar mensaje de éxito en pantalla
                mostrarMensaje("¡Cuotas generadas con éxito!", false);

            } catch (error) {
                mostrarMensaje("Error interno: " + error.message, true);
            }
        }

        function marcarPagado(boton) {
            try {
                const fila = boton.parentElement.parentElement;
                fila.classList.add('pagado');
                fila.querySelector('.estado').innerText = "Pagado";
                boton.setAttribute('disabled', 'true');
                boton.innerText = "Cobrado";
                boton.style.backgroundColor = "gray"; 
                guardarDatosEnMemoria();
                mostrarMensaje("Cuota marcada como cobrada.", false);
            } catch(error) {
                mostrarMensaje("Error al cobrar: " + error.message, true);
            }
        }

        function guardarDatosEnMemoria() {
            const cuerpoTabla = document.getElementById('listaCuotas');
            localStorage.setItem('memoriaPrestamos', cuerpoTabla.innerHTML);
        }

        function cargarDatosGuardados() {
            try {
                const datosGuardados = localStorage.getItem('memoriaPrestamos');
                if (datosGuardados) {
                    document.getElementById('listaCuotas').innerHTML = datosGuardados;
                }
            } catch(e) {
                mostrarMensaje("El navegador bloqueó la memoria.", true);
            }
        }

        function limpiarTodo() {
            if(confirm("¿Estás seguro de que quieres borrar todo el historial?")) {
                localStorage.removeItem('memoriaPrestamos'); 
                document.getElementById('listaCuotas').innerHTML = ""; 
                mostrarMensaje("Datos borrados correctamente.", false);
            }
        }
    </script>
</body>
</html>
