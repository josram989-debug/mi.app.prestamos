<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Préstamos</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 15px; 
            background-color: #f4f4f9;
        }
        .contenedor { 
            max-width: 600px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, button { 
            padding: 10px; 
            margin: 5px 0 15px 0; 
            width: 100%; 
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #0044cc; /* Un azul un poco más oscuro y legible */
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }
        button:hover { background-color: #003399; }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            font-size: 14px;
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: center; 
        }
        .pagado { 
            background-color: #d4edda; 
            color: #155724;
            text-decoration: line-through; 
        }
        .boton-cobrar {
            padding: 8px 5px; /* Un poco más grande para tocar fácil en móvil */
            font-size: 14px;
            margin: 0;
            background-color: #28a745; /* Botón verde para cobrar */
        }
        .boton-cobrar:hover {
            background-color: #218838;
        }
        .separador {
            background-color: #e9ecef;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Registrar Nuevo Préstamo</h2>
        
        <label>Concepto / Cliente:</label>
        <input type="text" id="concepto" placeholder="Ej. Maria Ferreira">

        <label>Monto del Préstamo:</label>
        <!-- Cambiamos a type="tel" para que en los móviles aparezca el teclado numérico grande -->
        <input type="tel" id="monto" placeholder="Ej. 1000000">
        
        <label>Interés Total (%):</label>
        <input type="tel" id="interes" placeholder="Ej. 32">
        
        <label>Plazo (cantidad de cuotas):</label>
        <input type="tel" id="plazo" placeholder="Ej. 44">
        
        <button onclick="generarPrestamo()">Generar Cuotas</button>
        
        <button onclick="limpiarTodo()" style="background-color: #dc3545;">Borrar Todos los Datos</button>

        <h3>Cronograma de Pagos</h3>
        <table>
            <thead>
                <tr>
                    <th>Detalle</th>
                    <th>Monto</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="listaCuotas">
            </tbody>
        </table>
    </div>

    <script>
        window.onload = function() {
            cargarDatosGuardados();
        };

        function generarPrestamo() {
            try {
                // 1. Obtenemos los valores y usamos .trim() para limpiar espacios invisibles
                const conceptoValor = document.getElementById('concepto').value.trim();
                const montoValor = document.getElementById('monto').value.trim();
                const interesValor = document.getElementById('interes').value.trim();
                const plazoValor = document.getElementById('plazo').value.trim();

                // 2. Validaciones específicas para saber dónde está el error
                if (conceptoValor === "") {
                    alert("Error: Por favor ingresa el Nombre o Concepto.");
                    return;
                }
                
                const monto = parseFloat(montoValor);
                if (isNaN(monto) || monto <= 0) {
                    alert("Error: El monto ingresado no es válido. Asegúrate de escribir solo números.");
                    return;
                }
                
                const interes = parseFloat(interesValor);
                if (isNaN(interes) || interes < 0) {
                    alert("Error: El interés ingresado no es válido.");
                    return;
                }
                
                const plazo = parseInt(plazoValor);
                if (isNaN(plazo) || plazo <= 0) {
                    alert("Error: El plazo de cuotas no es válido.");
                    return;
                }

                // 3. Cálculos matemáticos
                const montoInteres = monto * (interes / 100);
                const montoTotal = monto + montoInteres;
                const valorCuota = (montoTotal / plazo).toFixed(2); 

                const cuerpoTabla = document.getElementById('listaCuotas');

                // 4. Generación de las filas en la tabla HTML
                const filaTitulo = document.createElement('tr');
                filaTitulo.innerHTML = <td colspan="4" class="separador">Préstamo: ${conceptoValor} - Total: $${montoTotal.toFixed(2)}</td>;
                cuerpoTabla.appendChild(filaTitulo);

                for (let i = 1; i <= plazo; i++) {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>Cuota ${i}</td>
                        <td>$${valorCuota}</td>
                        <td class="estado">Pendiente</td>
                        <td><button class="boton-cobrar" onclick="marcarPagado(this)">Cobrar</button></td>
                    `;
                    cuerpoTabla.appendChild(fila);
                }

                // Guardamos en la memoria y limpiamos
                guardarDatosEnMemoria();
                document.getElementById('concepto').value = '';
                document.getElementById('monto').value = '';
                
                // Mensaje de éxito
                alert("¡Las cuotas se han generado correctamente!");

            } catch (error) {
                // Si algo falla en el código, nos avisará con este mensaje
                alert("Ocurrió un error interno: " + error.message);
            }
        }

        function marcarPagado(boton) {
            const fila = boton.parentElement.parentElement;
            fila.classList.add('pagado');
            fila.querySelector('.estado').innerText = "Pagado";
            
            boton.setAttribute('disabled', 'true');
            boton.innerText = "Cobrado";
            boton.style.backgroundColor = "gray"; 

            guardarDatosEnMemoria();
        }

        // --- FUNCIONES DE MEMORIA (LocalStorage) ---
        function guardarDatosEnMemoria() {
            const cuerpoTabla = document.getElementById('listaCuotas');
            localStorage.setItem('memoriaPrestamos', cuerpoTabla.innerHTML);
        }

        function cargarDatosGuardados() {
            const datosGuardados = localStorage.getItem('memoriaPrestamos');
            if (datosGuardados) {
                document.getElementById('listaCuotas').innerHTML = datosGuardados;
            }
        }

        function limpiarTodo() {
            if(confirm("¿Estás seguro de que quieres borrar todo el historial?")) {
                localStorage.removeItem('memoriaPrestamos'); 
                document.getElementById('listaCuotas').innerHTML = ""; 
            }
        }
    </script>
</body>
</html>
