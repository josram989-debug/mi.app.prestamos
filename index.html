<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Préstamos V6</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 15px; 
            background-color: #f4f4f9;
        }
        .contenedor { 
            max-width: 600px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, button { 
            padding: 10px; 
            margin: 5px 0 15px 0; 
            width: 100%; 
            box-sizing: border-box;
            font-size: 16px;
        }
        #btn-generar {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            padding: 15px; 
        }
        #btn-generar:hover { background-color: #0056b3; }
        
        #btn-borrar {
            background-color: #dc3545; 
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }
        
        #panel-mensajes {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            display: none; 
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            font-size: 14px;
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: center; 
        }
        .pagado { 
            background-color: #d4edda; 
            color: #155724;
            text-decoration: line-through; 
        }
        .boton-cobrar {
            padding: 8px 5px; 
            font-size: 14px;
            margin: 0;
            background-color: #28a745; 
            color: white;
            border: none;
            border-radius: 3px;
        }
        .separador {
            background-color: #e9ecef;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2 id="titulo-principal">Registrar Nuevo Préstamo</h2>
        
        <!-- Panel para mostrar errores ocultos del navegador -->
        <div id="panel-mensajes"></div>
        
        <label>Concepto / Cliente:</label>
        <input type="text" id="concepto" placeholder="Ej. Maria Ferreira">

        <label>Monto del Préstamo:</label>
        <input type="tel" id="monto" placeholder="Ej. 1000000">
        
        <label>Interés Total (%):</label>
        <input type="tel" id="interes" placeholder="Ej. 32">
        
        <label>Plazo (cantidad de cuotas):</label>
        <input type="tel" id="plazo" placeholder="Ej. 44">
        
        <!-- Ya no usamos onclick aquí -->
        <button id="btn-generar">Generar Cuotas (V6)</button>
        <button id="btn-borrar">Borrar Todos los Datos</button>

        <h3>Cronograma de Pagos</h3>
        <table>
            <thead>
                <tr>
                    <th>Detalle</th>
                    <th>Monto</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="listaCuotas">
            </tbody>
        </table>
    </div>

    <!-- EL CÓDIGO JAVASCRIPT -->
    <script>
        // 1. MANEJADOR GLOBAL DE ERRORES: Captura cualquier falla silenciosa
        window.onerror = function(mensaje, origen, linea) {
            var panel = document.getElementById('panel-mensajes');
            if (panel) {
                panel.style.display = 'block';
                panel.style.backgroundColor = '#f8d7da';
                panel.style.color = '#721c24';
                panel.innerHTML = "<strong>Error en móvil:</strong> " + mensaje + " (Línea " + linea + ")";
            }
            return true;
        };

        // 2. PRUEBA DE VIDA Y CAMBIO VISUAL
        var titulo = document.getElementById('titulo-principal');
        if (titulo) {
            titulo.innerText = "Sistema V6 Conectado";
            titulo.style.color = "#007BFF"; // Azul
        }

        // 3. FUNCIONES DEL SISTEMA
        function mostrarMensaje(texto, esError) {
            var panel = document.getElementById('panel-mensajes');
            panel.style.display = 'block'; 
            panel.innerText = texto;
            
            if (esError) {
                panel.style.backgroundColor = '#f8d7da'; 
                panel.style.color = '#721c24'; 
            } else {
                panel.style.backgroundColor = '#d4edda'; 
                panel.style.color = '#155724'; 
            }
        }

        function generarPrestamo() {
            try {
                var inputConcepto = document.getElementById('concepto').value || "";
                var inputMonto = document.getElementById('monto').value || "";
                var inputInteres = document.getElementById('interes').value || "";
                var inputPlazo = document.getElementById('plazo').value || "";

                var conceptoValor = inputConcepto.trim();
                var montoValor = inputMonto.trim();
                var interesValor = inputInteres.trim();
                var plazoValor = inputPlazo.trim();

                if (conceptoValor === "") {
                    mostrarMensaje("Por favor, ingresa el concepto o nombre.", true);
                    return;
                }
                
                var monto = parseFloat(montoValor);
                if (isNaN(monto) || monto <= 0) {
                    mostrarMensaje("Revisa el monto ingresado.", true);
                    return;
                }
                
                var interes = parseFloat(interesValor);
                if (isNaN(interes) || interes < 0) {
                    mostrarMensaje("Revisa el porcentaje de interés.", true);
                    return;
                }
                
                var plazo = parseInt(plazoValor);
                if (isNaN(plazo) || plazo <= 0) {
                    mostrarMensaje("Revisa la cantidad de cuotas.", true);
                    return;
                }

                var montoInteres = monto * (interes / 100);
                var montoTotal = monto + montoInteres;
                var valorCuota = (montoTotal / plazo).toFixed(2); 

                var cuerpoTabla = document.getElementById('listaCuotas');

                var filaTitulo = document.createElement('tr');
                filaTitulo.innerHTML = '<td colspan="4" class="separador">Préstamo: ' + conceptoValor + ' - Total: $' + montoTotal.toFixed(2) + '</td>';
                cuerpoTabla.appendChild(filaTitulo);

                for (var i = 1; i <= plazo; i++) {
                    var fila = document.createElement('tr');
                    // Usamos botones generados de forma clásica
                    fila.innerHTML = '<td>Cuota ' + i + '</td>' +
                                     '<td>$' + valorCuota + '</td>' +
                                     '<td class="estado">Pendiente</td>' +
                                     '<td><button class="boton-cobrar" onclick="marcarPagado(this)">Cobrar</button></td>';
                    cuerpoTabla.appendChild(fila);
                }

                guardarDatosEnMemoria();
                
                document.getElementById('concepto').value = '';
                document.getElementById('monto').value = '';
                document.getElementById('interes').value = '';
                document.getElementById('plazo').value = '';

                mostrarMensaje("¡Cuotas generadas exitosamente!", false);

            } catch (error) {
                mostrarMensaje("Fallo al generar cuotas: " + error.message, true);
            }
        }

        function marcarPagado(boton) {
            try {
                var fila = boton.parentElement.parentElement;
                fila.classList.add('pagado');
                fila.querySelector('.estado').innerText = "Pagado";
                boton.setAttribute('disabled', 'true');
                boton.innerText = "Cobrado";
                boton.style.backgroundColor = "gray"; 
                guardarDatosEnMemoria();
                mostrarMensaje("Cuota cobrada.", false);
            } catch(error) {
                mostrarMensaje("Error al marcar pago: " + error.message, true);
            }
        }

        function guardarDatosEnMemoria() {
            try {
                var cuerpoTabla = document.getElementById('listaCuotas');
                localStorage.setItem('memoriaPrestamos', cuerpoTabla.innerHTML);
            } catch(e) {
                // Silencioso, si falla por estar en incógnito, simplemente no guarda
            }
        }

        function cargarDatosGuardados() {
            try {
                var datosGuardados = localStorage.getItem('memoriaPrestamos');
                if (datosGuardados) {
                    document.getElementById('listaCuotas').innerHTML = datosGuardados;
                }
            } catch(e) {
                mostrarMensaje("Aviso: No se puede cargar el historial en este navegador.", true);
            }
        }

        function limpiarTodo() {
            if(confirm("¿Estás seguro de que quieres borrar todos los datos?")) {
                try {
                    localStorage.removeItem('memoriaPrestamos'); 
                    document.getElementById('listaCuotas').innerHTML = ""; 
                    mostrarMensaje("Los datos han sido borrados.", false);
                } catch(e) {
                    mostrarMensaje("Error al intentar borrar la memoria.", true);
                }
            }
        }

        // 4. INICIALIZACIÓN SEGURA Y CONEXIÓN DE BOTONES
        document.addEventListener("DOMContentLoaded", function() {
            // Conectamos los botones usando Event Listeners
            document.getElementById('btn-generar').addEventListener('click', generarPrestamo);
            document.getElementById('btn-borrar').addEventListener('click', limpiarTodo);
            
            cargarDatosGuardados();
            mostrarMensaje("La aplicación está lista para usar.", false);
        });

    </script>
</body>
</html>
