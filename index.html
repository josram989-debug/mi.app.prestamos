<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Préstamos V3</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 15px; 
            background-color: #f4f4f9;
        }
        .contenedor { 
            max-width: 600px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, button { 
            padding: 10px; 
            margin: 5px 0 15px 0; 
            width: 100%; 
            box-sizing: border-box;
            font-size: 16px;
        }
        /* Cambio de color temporal para confirmar actualización visual */
        #btn-generar {
            background-color: #28a745; /* Verde */
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }
        #btn-borrar {
            background-color: #dc3545; /* Rojo */
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            font-size: 14px;
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: center; 
        }
        .pagado { 
            background-color: #d4edda; 
            color: #155724;
            text-decoration: line-through; 
        }
        .boton-cobrar {
            padding: 8px 5px; 
            font-size: 14px;
            margin: 0;
            background-color: #17a2b8; 
            color: white;
            border: none;
            border-radius: 3px;
        }
        .separador {
            background-color: #e9ecef;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Registrar Nuevo Préstamo</h2>
        
        <label>Concepto / Cliente:</label>
        <input type="text" id="concepto" placeholder="Ej. Maria Ferreira">

        <label>Monto del Préstamo:</label>
        <input type="tel" id="monto" placeholder="Ej. 1000000">
        
        <label>Interés Total (%):</label>
        <input type="tel" id="interes" placeholder="Ej. 32">
        
        <label>Plazo (cantidad de cuotas):</label>
        <input type="tel" id="plazo" placeholder="Ej. 44">
        
        <!-- Botón con ID específico -->
        <button id="btn-generar" onclick="generarPrestamo()">Generar Cuotas (Prueba)</button>
        <button id="btn-borrar" onclick="limpiarTodo()">Borrar Todos los Datos</button>

        <h3>Cronograma de Pagos</h3>
        <table>
            <thead>
                <tr>
                    <th>Detalle</th>
                    <th>Monto</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="listaCuotas">
            </tbody>
        </table>
    </div>

    <script>
        // 1. DIAGNÓSTICO INICIAL: Esto debe saltar apenas abres la página
        alert("¡Versión 3 cargada correctamente en tu móvil! El código está actualizado.");

        window.onload = function() {
            cargarDatosGuardados();
        };

        function generarPrestamo() {
            // 2. DIAGNÓSTICO DE BOTÓN: Esto asegura que el botón reacciona al toque
            alert("El botón funciona. Iniciando los cálculos...");

            try {
                const conceptoValor = document.getElementById('concepto').value.trim();
                const montoValor = document.getElementById('monto').value.trim();
                const interesValor = document.getElementById('interes').value.trim();
                const plazoValor = document.getElementById('plazo').value.trim();

                if (conceptoValor === "") {
                    alert("Error: Falta el nombre del cliente.");
                    return;
                }
                
                const monto = parseFloat(montoValor);
                if (isNaN(monto) || monto <= 0) {
                    alert("Error: Revisa el monto. Solo ingresa números.");
                    return;
                }
                
                const interes = parseFloat(interesValor);
                if (isNaN(interes) || interes < 0) {
                    alert("Error: Revisa el interés.");
                    return;
                }
                
                const plazo = parseInt(plazoValor);
                if (isNaN(plazo) || plazo <= 0) {
                    alert("Error: Revisa el plazo.");
                    return;
                }

                const montoInteres = monto * (interes / 100);
                const montoTotal = monto + montoInteres;
                const valorCuota = (montoTotal / plazo).toFixed(2); 

                const cuerpoTabla = document.getElementById('listaCuotas');

                const filaTitulo = document.createElement('tr');
                filaTitulo.innerHTML = <td colspan="4" class="separador">Préstamo: ${conceptoValor} - Total: $${montoTotal.toFixed(2)}</td>;
                cuerpoTabla.appendChild(filaTitulo);

                for (let i = 1; i <= plazo; i++) {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>Cuota ${i}</td>
                        <td>$${valorCuota}</td>
                        <td class="estado">Pendiente</td>
                        <td><button class="boton-cobrar" onclick="marcarPagado(this)">Cobrar</button></td>
                    `;
                    cuerpoTabla.appendChild(fila);
                }

                guardarDatosEnMemoria();
                
                document.getElementById('concepto').value = '';
                document.getElementById('monto').value = '';
                document.getElementById('interes').value = '';
                document.getElementById('plazo').value = '';

                alert("¡Cuotas generadas con éxito!");

            } catch (error) {
                alert("Ocurrió un error en el código: " + error.message);
            }
        }

        function marcarPagado(boton) {
            const fila = boton.parentElement.parentElement;
            fila.classList.add('pagado');
            fila.querySelector('.estado').innerText = "Pagado";
            boton.setAttribute('disabled', 'true');
            boton.innerText = "Cobrado";
            boton.style.backgroundColor = "gray"; 
            guardarDatosEnMemoria();
        }

        function guardarDatosEnMemoria() {
            const cuerpoTabla = document.getElementById('listaCuotas');
            localStorage.setItem('memoriaPrestamos', cuerpoTabla.innerHTML);
        }

        function cargarDatosGuardados() {
            const datosGuardados = localStorage.getItem('memoriaPrestamos');
            if (datosGuardados) {
                document.getElementById('listaCuotas').innerHTML = datosGuardados;
            }
        }

        function limpiarTodo() {
            if(confirm("¿Estás seguro de que quieres borrar todo el historial?")) {
                localStorage.removeItem('memoriaPrestamos'); 
                document.getElementById('listaCuotas').innerHTML = ""; 
            }
        }
    </script>
</body>
</html>
