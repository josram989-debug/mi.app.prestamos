<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Préstamos V5</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 15px; 
            background-color: #f4f4f9;
        }
        .contenedor { 
            max-width: 600px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, button { 
            padding: 10px; 
            margin: 5px 0 15px 0; 
            width: 100%; 
            box-sizing: border-box;
            font-size: 16px;
        }
        #btn-generar {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            padding: 15px; /* Botón un poco más alto para móviles */
        }
        #btn-generar:hover { background-color: #0056b3; }
        
        #btn-borrar {
            background-color: #dc3545; 
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }
        
        #panel-mensajes {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            display: none; 
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            font-size: 14px;
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: center; 
        }
        .pagado { 
            background-color: #d4edda; 
            color: #155724;
            text-decoration: line-through; 
        }
        .boton-cobrar {
            padding: 8px 5px; 
            font-size: 14px;
            margin: 0;
            background-color: #28a745; 
            color: white;
            border: none;
            border-radius: 3px;
        }
        .separador {
            background-color: #e9ecef;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Si el navegador tiene bloqueado el código, esto se mostrará -->
    <noscript>
        <div style="background-color: red; color: white; padding: 15px; font-weight: bold; text-align: center; border-radius: 5px; margin-bottom: 15px;">
            ATENCIÓN: Tu navegador móvil está bloqueando JavaScript. Por favor, activa JavaScript en la configuración de tu navegador.
        </div>
    </noscript>

    <div class="contenedor">
        <!-- Le pusimos un ID al título para poder modificarlo con código -->
        <h2 id="titulo-principal">Registrar Nuevo Préstamo</h2>
        
        <div id="panel-mensajes"></div>
        
        <label>Concepto / Cliente:</label>
        <input type="text" id="concepto" placeholder="Ej. Maria Ferreira">

        <!-- Volvemos a type="tel" para evitar bugs de teclado en móviles -->
        <label>Monto del Préstamo:</label>
        <input type="tel" id="monto" placeholder="Ej. 1000000">
        
        <label>Interés Total (%):</label>
        <input type="tel" id="interes" placeholder="Ej. 32">
        
        <label>Plazo (cantidad de cuotas):</label>
        <input type="tel" id="plazo" placeholder="Ej. 44">
        
        <button id="btn-generar" onclick="generarPrestamo()">Generar Cuotas (V5)</button>
        <button id="btn-borrar" onclick="limpiarTodo()">Borrar Todos los Datos</button>

        <h3>Cronograma de Pagos</h3>
        <table>
            <thead>
                <tr>
                    <th>Detalle</th>
                    <th>Monto</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="listaCuotas">
            </tbody>
        </table>
    </div>

    <script>
        // --- PRUEBA DE VIDA INMEDIATA ---
        // Este código se ejecuta apenas el navegador lee esta línea. 
        // Si no ves el título verde en tu celular, el celular está apagando el código.
        const titulo = document.getElementById('titulo-principal');
        if (titulo) {
            titulo.innerText = "Sistema Activo V5";
            titulo.style.color = "green";
        }

        function mostrarMensaje(texto, esError) {
            const panel = document.getElementById('panel-mensajes');
            panel.style.display = 'block'; 
            panel.innerText = texto;
            
            if (esError) {
                panel.style.backgroundColor = '#f8d7da'; 
                panel.style.color = '#721c24'; 
            } else {
                panel.style.backgroundColor = '#d4edda'; 
                panel.style.color = '#155724'; 
            }
        }

        // Usamos una forma más segura de cargar los datos iniciales
        document.addEventListener("DOMContentLoaded", function() {
            cargarDatosGuardados();
            mostrarMensaje("Memoria lista para usar.", false);
        });

        function generarPrestamo() {
            try {
                // Obtenemos los valores de forma súper segura
                const inputConcepto = document.getElementById('concepto').value || "";
                const inputMonto = document.getElementById('monto').value || "";
                const inputInteres = document.getElementById('interes').value || "";
                const inputPlazo = document.getElementById('plazo').value || "";

                const conceptoValor = inputConcepto.trim();
                const montoValor = inputMonto.trim();
                const interesValor = inputInteres.trim();
                const plazoValor = inputPlazo.trim();

                if (conceptoValor === "") {
                    mostrarMensaje("Error: Escribe un nombre o concepto.", true);
                    return;
                }
                
                const monto = parseFloat(montoValor);
                if (isNaN(monto) || monto <= 0) {
                    mostrarMensaje("Error: El monto no es un número válido.", true);
                    return;
                }
                
                const interes = parseFloat(interesValor);
                if (isNaN(interes) || interes < 0) {
                    mostrarMensaje("Error: El interés no es válido.", true);
                    return;
                }
                
                const plazo = parseInt(plazoValor);
                if (isNaN(plazo) || plazo <= 0) {
                    mostrarMensaje("Error: El plazo no es válido.", true);
                    return;
                }

                const montoInteres = monto * (interes / 100);
                const montoTotal = monto + montoInteres;
                const valorCuota = (montoTotal / plazo).toFixed(2); 

                const cuerpoTabla = document.getElementById('listaCuotas');

                const filaTitulo = document.createElement('tr');
                filaTitulo.innerHTML = <td colspan="4" class="separador">Préstamo: ${conceptoValor} - Total: $${montoTotal.toFixed(2)}</td>;
                cuerpoTabla.appendChild(filaTitulo);

                for (let i = 1; i <= plazo; i++) {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>Cuota ${i}</td>
                        <td>$${valorCuota}</td>
                        <td class="estado">Pendiente</td>
                        <td><button class="boton-cobrar" onclick="marcarPagado(this)">Cobrar</button></td>
                    `;
                    cuerpoTabla.appendChild(fila);
                }

                guardarDatosEnMemoria();
                
                document.getElementById('concepto').value = '';
                document.getElementById('monto').value = '';
                document.getElementById('interes').value = '';
                document.getElementById('plazo').value = '';

                mostrarMensaje("¡Cuotas creadas correctamente!", false);

            } catch (error) {
                mostrarMensaje("Fallo en el sistema: " + error.message, true);
            }
        }

        function marcarPagado(boton) {
            try {
                const fila = boton.parentElement.parentElement;
                fila.classList.add('pagado');
                fila.querySelector('.estado').innerText = "Pagado";
                boton.setAttribute('disabled', 'true');
                boton.innerText = "Cobrado";
                boton.style.backgroundColor = "gray"; 
                guardarDatosEnMemoria();
                mostrarMensaje("Pago registrado.", false);
            } catch(error) {
                mostrarMensaje("Error: " + error.message, true);
            }
        }

        function guardarDatosEnMemoria() {
            try {
                const cuerpoTabla = document.getElementById('listaCuotas');
                localStorage.setItem('memoriaPrestamos', cuerpoTabla.innerHTML);
            } catch(e) {
                console.log("No se pudo guardar la memoria");
            }
        }

        function cargarDatosGuardados() {
            try {
                const datosGuardados = localStorage.getItem('memoriaPrestamos');
                if (datosGuardados) {
                    document.getElementById('listaCuotas').innerHTML = datosGuardados;
                }
            } catch(e) {
                mostrarMensaje("Aviso: Memoria bloqueada por el navegador.", true);
            }
        }

        function limpiarTodo() {
            if(confirm("¿Estás seguro de que quieres borrar todo el historial?")) {
                try {
                    localStorage.removeItem('memoriaPrestamos'); 
                    document.getElementById('listaCuotas').innerHTML = ""; 
                    mostrarMensaje("Tabla borrada limpia.", false);
                } catch(e) {
                    mostrarMensaje("No se pudo borrar la memoria.", true);
                }
            }
        }
    </script>
</body>
</html>
